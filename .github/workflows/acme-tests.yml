name: ACME Tests

on: [push, pull_request]

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  BASE_IMAGE: ${{ vars.BASE_IMAGE }}
  COPR_REPO: ${{ vars.COPR_REPO }}

jobs:
  # Disabled until the approved dnsjava artifact is available to runners.
  acme-caa-test:
    name: CAA and DNSSEC
    if: ${{ false }}
    uses: ./.github/workflows/acme-caa-test.yml

  build:
    name: Building ACME images
    runs-on: ubuntu-latest
    env:
      NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'dogtagpki' }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Initialization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TESTS: ${{ vars.TESTS }}
        run: tests/bin/test-init.sh

      - name: Update Dockerfile
        run: |
          # update registry namespace
          sed -i "s/quay.io\/dogtagpki\//quay.io\/$NAMESPACE\//g" Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        id: cache-buildx
        uses: actions/cache@v5
        with:
          key: buildx-${{ hashFiles('pki.spec') }}
          path: /tmp/.buildx-cache

      - name: Build pki-deps image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            COPR_REPO=${{ env.COPR_REPO }}
          tags: pki-deps
          target: pki-deps
          cache-to: type=local,dest=/tmp/.buildx-cache
        if: steps.cache-buildx.outputs.cache-hit != 'true'

      - name: Build pki-builder-deps image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            COPR_REPO=${{ env.COPR_REPO }}
          tags: pki-builder-deps
          target: pki-builder-deps
          cache-to: type=local,dest=/tmp/.buildx-cache
        if: steps.cache-buildx.outputs.cache-hit != 'true'

      - name: Build pki-runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            COPR_REPO=${{ env.COPR_REPO }}
            BUILD_OPTS=--with-pkgs=base,server,ca,acme --without-test
          tags: pki-runner
          target: pki-runner
          cache-from: type=local,src=/tmp/.buildx-cache
          outputs: type=docker

      - name: Load PKI builder for ACME engine tests
        if: ${{ false }}
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            COPR_REPO=${{ env.COPR_REPO }}
            BUILD_OPTS=--with-pkgs=base,server,ca,acme --without-test
          tags: pki-acme-builder
          target: pki-builder
          cache-from: type=local,src=/tmp/.buildx-cache
          outputs: type=docker

      - name: Test actual ACME engine CAA approval path
        if: ${{ false }}
        run: |
          docker run --name acme-caa-engine --entrypoint /bin/bash pki-acme-builder -lc '
            set -e
            cd /root/pki
            dnf install -y gcc pkgconf-pkg-config unbound-devel
            mvn -B -ntp -f pom.xml -Pacme-dnsjava,acme-libunbound \
              -pl base/acme/caa-plugins/dnsjava,base/acme/caa-plugins/libunbound -am -Dapi.v1=true \
              -Dtest=ACMEEngineCAATest -Dsurefire.failIfNoSpecifiedTests=false package
            sh tests/caa-plugin/libunbound/build-native.sh
            python3 tests/caa-plugin/check-reports.py engine
          '

      - name: Collect optional adapters for enrollment tests
        if: ${{ false }}
        run: |
          mkdir -p acme-caa-runtime
          docker cp acme-caa-engine:/root/pki/base/acme/caa-plugins/dnsjava/target/pki-acme-dnsjava.jar acme-caa-runtime/
          docker cp acme-caa-engine:/root/pki/base/acme/caa-plugins/libunbound/target/pki-acme-libunbound.jar acme-caa-runtime/
          docker cp acme-caa-engine:/root/pki/tests/caa-plugin/libunbound/target/native/libpki_acme_unbound.so acme-caa-runtime/
          docker cp acme-caa-engine:/root/.m2/repository/dnsjava/dnsjava/3.6.5/dnsjava-3.6.5.jar acme-caa-runtime/dnsjava.jar

      - name: Store optional enrollment test adapters
        if: ${{ false }}
        uses: actions/upload-artifact@v7
        with:
          name: acme-caa-runtime
          path: acme-caa-runtime/
          if-no-files-found: error

      - name: Collect ACME engine test reports
        if: ${{ false }}
        run: |
          mkdir -p acme-caa-engine-reports
          if docker container inspect acme-caa-engine > /dev/null 2>&1; then
            docker cp acme-caa-engine:/root/pki/base/acme/target/surefire-reports/. \
              acme-caa-engine-reports/ || true
          fi

      - name: Preserve ACME engine test reports
        if: ${{ false }}
        uses: actions/upload-artifact@v7
        with:
          name: acme-caa-engine
          path: acme-caa-engine-reports/
          if-no-files-found: warn

      - name: Build pki-ca image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            COPR_REPO=${{ env.COPR_REPO }}
            BUILD_OPTS=--with-pkgs=base,server,ca,acme --without-test
          tags: pki-ca
          target: pki-ca
          cache-from: type=local,src=/tmp/.buildx-cache
          outputs: type=docker

      - name: Build pki-acme image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            COPR_REPO=${{ env.COPR_REPO }}
            BUILD_OPTS=--with-pkgs=base,server,ca,acme --without-test
          tags: pki-acme
          target: pki-acme
          cache-from: type=local,src=/tmp/.buildx-cache
          outputs: type=docker

      - name: Save ACME images
        run: |
          docker images
          docker save -o acme-images.tar pki-runner pki-ca pki-acme

      - name: Store ACME images
        uses: actions/cache@v5
        with:
          key: acme-images-${{ github.sha }}
          path: acme-images.tar

  acme-basic-test:
    name: Basic ACME
    needs: build
    uses: ./.github/workflows/acme-basic-test.yml

  acme-caddy-test:
    name: ACME with Caddy
    needs: build
    uses: ./.github/workflows/acme-caddy-test.yml

  acme-caa-enrollment-test:
    name: ACME CAA enrollment and DNSSEC
    if: ${{ false }}
    needs: build
    uses: ./.github/workflows/acme-basic-test.yml
    with:
      caa: true

  acme-separate-test:
    name: ACME on separate instance
    needs: build
    uses: ./.github/workflows/acme-separate-test.yml

  acme-existing-nssdb-test:
    name: ACME with existing NSS database
    needs: build
    uses: ./.github/workflows/acme-existing-nssdb-test.yml

  acme-switchover-test:
    name: ACME server switchover
    needs: build
    uses: ./.github/workflows/acme-switchover-test.yml

  acme-container-basic-test:
    name: Basic ACME container
    needs: build
    uses: ./.github/workflows/acme-container-basic-test.yml

  acme-container-ca-test:
    name: ACME container with CA
    needs: build
    uses: ./.github/workflows/acme-container-ca-test.yml

  acme-postgresql-test:
    name: ACME with postgresql back-end
    needs: build
    uses: ./.github/workflows/acme-postgresql-test.yml

  acme-clone-test:
    name: ACME clone
    needs: build
    uses: ./.github/workflows/acme-clone-test.yml

  publish:
    if: github.event_name == 'push' && github.ref_name == 'master'
    name: Publishing ACME images
    needs: build
    runs-on: ubuntu-latest
    env:
      NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || github.repository_owner }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: vars.REGISTRY == 'ghcr.io'

      - name: Log in to other container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        if: vars.REGISTRY != 'ghcr.io'

      - name: Retrieve ACME images
        uses: actions/cache@v5
        with:
          key: acme-images-${{ github.sha }}
          path: acme-images.tar

      - name: Load ACME images
        run: docker load --input acme-images.tar

      - name: Publish pki-acme image
        run: |
          docker tag pki-acme ${{ vars.REGISTRY }}/$NAMESPACE/pki-acme:latest
          docker push ${{ vars.REGISTRY }}/$NAMESPACE/pki-acme:latest
