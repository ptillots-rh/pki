# Enable CAA checking during ACME order finalization.
# - false preserves ordinary enrollment and opens no DNS provider.
# - true requires issuerIdentifiers, dns.class and the provider settings below.
# Restart the ACME instance after changing this file.
enabled=false

# Account binding uses the public baseURL configured in engine.conf, together
# with the deployed ACME webapp path. Enabled CAA requires that baseURL.
#
# Issuer policy:
# List the issuer identifiers published in the CA's CPS, separated by commas.
# These are the identifiers domain owners publish in issue/issuewild grants.
# issuerIdentifiers=ca.example.com

# DNS provider:
# The optional dnsjava adapter delegates validation to a trusted enforcing
# resolver. The operator installs and configures that resolver separately.
# - server is required: a numeric loopback address in ACME's network namespace.
# - port is optional and defaults to 53. Queries use TCP.
# - DNSSEC policy and trust-anchor maintenance belong to the resolver operator.
# dns.class=org.dogtagpki.acme.caa.dnsjava.DNSJavaCAAProvider
# dns.settings.server=127.0.0.1
# dns.settings.port=53
