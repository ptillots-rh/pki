# CAA authorization at order finalization. Restart ACME after changing this file.
# Existing/private CA deployments remain unchanged unless explicitly enabled.
enabled=false

# Required when enabled: the issuer identifiers published in the CA's CPS.
# issuerIdentifiers=ca.example.com

# Install the optional adapter before selecting its trusted provider class.
# dns.class=org.dogtagpki.acme.caa.dnsjava.DNSJavaCAAProvider
# dns.class=org.dogtagpki.acme.caa.libunbound.LibUnboundCAAProvider
# dns.settings.server=127.0.0.1
# dns.settings.port=53

# Local DNSSEC validation (libunbound): choose the fixed validating provider
# and an externally maintained DS/DNSKEY anchor file. No X.509 certificates.
# dns.class=org.dogtagpki.acme.caa.libunbound.LibUnboundCAAProvider$Validating
# dns.settings.trustAnchors=/etc/pki/pki-tomcat/acme/caa-trust-anchors.key
# Use an explicit static trusted-key export, not an RFC 5011 state file.

# Delegated validation: this requires a trusted, enforcing loopback resolver.
# dns.class=org.dogtagpki.acme.caa.dnsjava.DNSJavaCAAProvider$LocalValidatingResolver

# In-process DNSSEC validation (dnsjava): validate locally rather than trusting
# the upstream resolver's AD flag. The numeric server supplies DNS data/proofs.
# dns.class=org.dogtagpki.acme.caa.dnsjava.DNSJavaCAAProvider$Validating
# dns.settings.trustAnchors=/etc/pki/pki-tomcat/acme/caa-trust-anchors.key
# Supply a static DS/DNSKEY trusted-key export, not an RFC 5011 managed file.
# Restart after updating anchors. Root anchors permit authenticated insecurity;
# zone-only anchors require secure results. No automatic rollover or reload.

# DNSSEC validation behavior is fixed by these classes, not by a mode setting.
